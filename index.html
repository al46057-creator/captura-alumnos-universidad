<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro de alumnos</title>

    <style>
        body {
            background-color: #f3ead8;
            font-family: "Times New Roman", serif;
        }

        h1 {
            color: #6b3e26;
        }

        p {
            color: #795548;
        }

        table {
            background-color: #fffaf0;
            border: 1px solid #b89b7a;
            padding: 15px;
        }

        td {
            padding: 8px;
        }

        input, select {
            padding: 5px;
        }

        button {
            background-color: #6b3e26;
            color: white;
            padding: 8px 15px;
            border: none;
        }
    </style>
</head>

<body>

    <h1>Registro de alumnos</h1>

    <p>Captura de información académica y personal</p>

    <form>

        <table>

            <tr>
                <td colspan="2"><strong>Datos personales</strong></td>
            </tr>

            <tr>
                <td>
                    <label for="nombre">Nombre:</label>
                </td>
                <td>
                    <input type="text" id="nombre" name="nombre">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="apellido">Apellidos:</label>
                </td>
                <td>
                    <input type="text" id="apellido" name="apellido">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="apellidoPaterno">Apellido Paterno:</label>
                </td>
                <td>
                    <input type="text" id="apellidoPaterno" name="apellidoPaterno">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="apellidoMaterno">Apellido Materno:</label>
                </td>
                <td>
                    <input type="text" id="apellidoMaterno" name="apellidoMaterno">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="curp">CURP:</label>
                </td>
                <td>
                    <input type="text" id="curp" name="curp">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="sexo">Sexo:</label>
                </td>
                <td>
                    <select id="sexo" name="sexo">
                        <option value="">Selecciona una opción</option>
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="estadoCivil">Estado Civil:</label>
                </td>
                <td>
                    <select id="estadoCivil" name="estadoCivil">
                        <option value="">Selecciona una opción</option>
                        <option value="soltero">Soltero(a)</option>
                        <option value="casado">Casado(a)</option>
                        <option value="divorciado">Divorciado(a)</option>
                        <option value="viudo">Viudo(a)</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="fecha">Fecha de nacimiento:</label>
                </td>
                <td>
                    <input type="date" id="fecha" name="fecha">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="edad">Edad:</label>
                </td>
                <td>
                    <input type="number" id="edad" name="edad" min="1" max="100">
                </td>
            </tr>

            <tr>
                <td colspan="2"><strong>Datos de contacto</strong></td>
            </tr>

            <tr>
                <td>
                    <label for="correo">Correo electrónico:</label>
                </td>
                <td>
                    <input type="email" id="correo" name="correo">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="telefono">Teléfono:</label>
                </td>
                <td>
                    <input type="tel" id="telefono" name="telefono">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="celular">Tel. Celular:</label>
                </td>
                <td>
                    <input type="tel" id="celular" name="celular">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="direccion">Dirección:</label>
                </td>
                <td>
                    <input type="text" id="direccion" name="direccion">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="colonia">Colonia:</label>
                </td>
                <td>
                    <input type="text" id="colonia" name="colonia">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="ciudad">Ciudad:</label>
                </td>
                <td>
                    <input type="text" id="ciudad" name="ciudad">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="poblacion">Población:</label>
                </td>
                <td>
                    <input type="text" id="poblacion" name="poblacion">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="cp">CP:</label>
                </td>
                <td>
                    <input type="text" id="cp" name="cp">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="estado">Estado:</label>
                </td>
                <td>
                    <select id="estado" name="estado">
                        <option value="">Selecciona un estado</option>
                        <option value="NL">Nuevo León</option>
                        <option value="COAH">Coahuila</option>
                        <option value="TAMPS">Tamaulipas</option>
                        <option value="SLP">San Luis Potosí</option>
                        <option value="CDMX">Ciudad de México</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td colspan="2"><strong>Información académica</strong></td>
            </tr>

            <tr>
                <td>
                    <label for="matricula">Matrícula:</label>
                </td>
                <td>
                    <input type="number" id="matricula" name="matricula" min="1">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="idCarrera">ID.Carrera:</label>
                </td>
                <td>
                    <input type="text" id="idCarrera" name="idCarrera">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="carrera">Carrera:</label>
                </td>
                <td>
                    <select id="carrera" name="carrera" required>
                        <option value="">Elige una carrera</option>
                        <option value="arquitectura">Arquitectura</option>
                        <option value="civil">Ingeniería Civil</option>
                        <option value="electronica">Ingeniería Electrónica</option>
                        <option value="administracion">Administración</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="sistemaEducativo">ID. Sistema Educativo:</label>
                </td>
                <td>
                    <select id="sistemaEducativo" name="sistemaEducativo">
                        <option value="">Selecciona una opción</option>
                        <option value="publico">Público</option>
                        <option value="privado">Privado</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="ingreso">Fecha de ingreso:</label>
                </td>
                <td>
                    <input type="date" id="ingreso" name="ingreso">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="semestre">Semestre:</label>
                </td>
                <td>
                    <input type="number" id="semestre" name="semestre" min="1" max="12">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="tetra">Tetra:</label>
                </td>
                <td>
                    <input type="text" id="tetra" name="tetra">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="status">Status:</label>
                </td>
                <td>
                    <input type="text" id="status" name="status">
                </td>
            </tr>

            <tr>
                <td colspan="2"><strong>Información adicional</strong></td>
            </tr>

            <tr>
                <td>
                    <label for="empresa">Empresa:</label>
                </td>
                <td>
                    <input type="text" id="empresa" name="empresa">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="idEmpresa">ID.Empresa:</label>
                </td>
                <td>
                    <input type="text" id="idEmpresa" name="idEmpresa">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="extEmpresa">Ext.Empresa:</label>
                </td>
                <td>
                    <input type="text" id="extEmpresa" name="extEmpresa">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="escuelaProcedencia">Escuela de Procedencia:</label>
                </td>
                <td>
                    <select id="escuelaProcedencia" name="escuelaProcedencia">
                        <option value="">Selecciona una opción</option>
                        <option value="publica">Pública</option>
                        <option value="privada">Privada</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="estadoPreparatoria">Estado donde Estudió Preparatoria:</label>
                </td>
                <td>
                    <select id="estadoPreparatoria" name="estadoPreparatoria">
                        <option value="">Selecciona un estado</option>
                        <option value="NL">Nuevo León</option>
                        <option value="COAH">Coahuila</option>
                        <option value="TAMPS">Tamaulipas</option>
                        <option value="SLP">San Luis Potosí</option>
                        <option value="CDMX">Ciudad de México</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="documento">Documento:</label>
                </td>
                <td>
                    <input type="file"
                           id="documento"
                           name="documento"
                           accept=".pdf,.jpg,.jpeg,.png">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="comentarios">Comentarios:</label>
                </td>
                <td>
                    <textarea id="comentarios"
                              name="comentarios"
                              rows="4"
                              cols="30"></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <button type="submit">Registrar alumno</button>
                    <button type="reset">Limpiar</button>
                </td>
            </tr>

        </table>

    </form>

</body>

</html>
